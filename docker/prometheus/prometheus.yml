# ============================================================
# Prometheus scrape config (docker compose --profile monitoring)
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'socialforge'

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The AdonisJS web app exposes /metrics via @julr/adonisjs-prometheus.
  - job_name: 'socialforge-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['web:3333']

  # RabbitMQ ships the prometheus plugin on 15692 in the -management image.
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
