# Development reverse proxy for the docker-compose network.
# Proxies to services by their compose service name (NOT 127.0.0.1, which is
# what the production host-nginx config socialforge.conf uses). Opt-in:
#   docker compose --profile proxy up -d nginx
#
# Single entrypoint on :80 -> web (SvelteKit), /api -> backend, /connection -> centrifugo.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sf_backend    { server backend:8080; }
upstream sf_web        { server web:5000; }
upstream sf_centrifugo { server centrifugo:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Backend REST API
    location /api/ {
        proxy_pass http://sf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://sf_backend;
        proxy_set_header Host $host;
    }

    # Centrifugo realtime websocket
    location /connection/ {
        proxy_pass http://sf_centrifugo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # SvelteKit dev server (includes Vite HMR websocket)
    location / {
        proxy_pass http://sf_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
