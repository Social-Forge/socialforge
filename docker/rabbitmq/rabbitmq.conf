# RabbitMQ Configuration
# The vhost + user are provisioned via RABBITMQ_DEFAULT_* env in docker-compose.
# The messaging topology (exchanges/queues/bindings) is asserted idempotently
# from the application at startup, so no definitions.json import is needed.
default_vhost = social_forge
loopback_users.guest = false

# Memory & disk
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Logging
log.console = true
log.console.level = warning
log.file = false
